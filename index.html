<!doctype html><html lang=vi><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Chess Bot</title><script src=https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js></script><style>body{margin:0;background:#222;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}.game{text-align:center}#board{width:480px;height:480px;max-width:90vw;max-height:90vw;display:grid;grid-template-columns:repeat(8,1fr);border:4px solid #111;margin:15px auto}.square{display:flex;justify-content:center;align-items:center;font-size:clamp(28px,7vw,55px);cursor:pointer;user-select:none}.white{background:#f0d9b5}.black{background:#b58863}.selected{background:#f6f669!important}button{padding:10px 18px;border:0;border-radius:6px;cursor:pointer;font-size:16px}#status{min-height:25px;margin:8px}</style><div class=game><h2>♟ Chess Bot</h2><div id=status>Bạn chơi Trắng</div><div id=board></div><button onclick=newGame()>New Game</button></div><script>const board=document.getElementById("board"),statusText=document.getElementById("status"),game=new Chess();let selected=null,botThinking=!1;const pieces={w:{k:"♔",q:"♕",r:"♖",b:"♗",n:"♘",p:"♙"},b:{k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"}};const stockfish=new Worker("https://cdn.jsdelivr.net/npm/stockfish@16.0.0/src/stockfish.js");stockfish.onmessage=e=>{let m=e.data;if(typeof m!="string"||!m.startsWith("bestmove"))return;let x=m.split(" ")[1];x&&x!="(none)"&&(game.move({from:x.slice(0,2),to:x.slice(2,4),promotion:x.slice(4,5)||"q"}),botThinking=!1,selected=null,drawBoard(),updateStatus())};stockfish.postMessage("uci");stockfish.postMessage("isready");function drawBoard(){board.innerHTML="";let p=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){let s=document.createElement("div"),n=String.fromCharCode(97+c)+(8-r),q=p[r][c];s.className="square "+((r+c)%2?"black":"white"),selected===n&&s.classList.add("selected"),q&&(s.textContent=pieces[q.color][q.type]),s.onclick=()=>clickSquare(n),board.appendChild(s)}}function clickSquare(s){if(botThinking||game.game_over()||game.turn()!="w")return;if(!selected){let p=game.get(s);return p&&p.color=="w"&&(selected=s,drawBoard())}if(selected==s)return selected=null,drawBoard();let m=game.move({from:selected,to:s,promotion:"q"});m?(selected=null,drawBoard(),updateStatus(),game.game_over()||botMove()):(game.get(s)?.color=="w"&&(selected=s,drawBoard()))}function botMove(){botThinking=!0;statusText.textContent="🤖 Bot đang suy nghĩ...";stockfish.postMessage("position fen "+game.fen());stockfish.postMessage("go depth 12")}function updateStatus(){if(game.in_checkmate())return statusText.textContent="🏆 "+(game.turn()=="w"?"Đen thắng!":"Trắng thắng!");if(game.in_draw())return statusText.textContent="🤝 Hòa!";if(game.in_check())return statusText.textContent="⚠️ "+(game.turn()=="w"?"Trắng đang bị chiếu!":"Đen đang bị chiếu!");statusText.textContent=game.turn()=="w"?"♙ Lượt của bạn":"🤖 Lượt của Bot"}function newGame(){game.reset();selected=null;botThinking=!1;drawBoard();updateStatus()}drawBoard();updateStatus()</script>
